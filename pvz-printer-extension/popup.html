<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 300px; padding: 16px; font-family: system-ui, sans-serif; margin: 0; font-size: 13px; }
    h2 { margin: 0 0 8px; font-size: 15px; }
    .status { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 8px; border-radius: 6px; background: #f5f5f5; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot.green { background: #22c55e; }
    .dot.red { background: #ef4444; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
    button { width: 100%; padding: 9px; background: #005bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    button:hover { background: #0047cc; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .info { margin-top: 12px; padding: 10px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; font-size: 11px; line-height: 1.5; color: #92400e; }
    .info a { color: #005bff; text-decoration: none; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h2>🖨️ PvzPrinter</h2>

  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Проверка...</span>
  </div>

  <!-- Ручной ввод (виден только при подключении) -->
  <div id="manualSection" class="hidden">
    <input type="text" id="cellCode" placeholder="Номер ячейки (например, 123-5)" />
    <button id="printBtn">Печать</button>
  </div>

  <!-- Информация для модератора / при отсутствии подключения -->
  <div id="infoSection" class="info">
    <strong>Как это работает:</strong><br/>
    Расширение автоматически печатает этикетки при сканировании штрихкодов на странице приёмки Ozon ПВЗ.<br/><br/>
    Для работы требуется локальное приложение <strong>PvzPrinter</strong>, которое управляет термопринтером.<br/><br/>
    <a href="https://github.com/your-repo/pvzprinter" target="_blank">Скачать PvzPrinter →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
