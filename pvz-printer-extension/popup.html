<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 280px; padding: 16px; font-family: system-ui, sans-serif; margin: 0; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    .status { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 13px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.green { background: #22c55e; }
    .dot.red { background: #ef4444; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; font-size: 14px; }
    button { width: 100%; padding: 10px; background: #8EB2F7; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    button:hover { background: #8EB2F7; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .hint { font-size: 11px; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>🖨️ PvzPrinter</h2>
  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Проверка...</span>
  </div>
  <input type="text" id="cellCode" placeholder="Номер ячейки (например, 123-5)" />
  <button id="printBtn">Печать</button>
  <div class="hint">Приложение PvzPrinter должно быть запущено</div>
  <script src="popup.js"></script>
</body>
</html>
